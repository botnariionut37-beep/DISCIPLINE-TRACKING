<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Circle Decorator -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.1" />

  <!-- The Sparkle Shape + Checkmark - Discipline Fusion Symbol -->
  <g transform="translate(146, 146)">
    <!-- Main Sparkling Shield Visual -->
    <path d="M 110,30 L 110,190 L 20,130 L 20,60 Z" fill="none" stroke="url(#neonGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.15" />
    
    <!-- Bold Checkmark depicting Routine and Execution -->
    <path d="M 50,115 L 95,160 L 180,75" fill="none" stroke="url(#neonGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Diamond spark accent (top-right) -->
    <path d="M 180,30 Q 180,50 200,50 Q 180,50 180,70 Q 180,50 160,50 Q 180,50 180,30 Z" fill="#34D399" />
  </g>
</svg>
